<?xml version="1.0" encoding="UTF-8"?>
<!-- "Jack the lad": icon of the OCaml-free Paparazzi (branch Jack_the_lad).
     A young sailor in an old-fashioned sailor suit, comic style. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="badge">
      <circle cx="256" cy="256" r="244"/>
    </clipPath>
  </defs>

  <!-- badge: sky, sea and rim -->
  <g clip-path="url(#badge)">
    <rect width="512" height="512" fill="#bfe6f7"/>
    <circle cx="410" cy="120" r="38" fill="#ffe08a"/>
    <path d="M0 360 Q 32 344 64 360 T 128 360 T 192 360 T 256 360 T 320 360 T 384 360 T 448 360 T 512 360 V512 H0 Z"
          fill="#3a86c8"/>
    <path d="M0 392 Q 32 376 64 392 T 128 392 T 192 392 T 256 392 T 320 392 T 384 392 T 448 392 T 512 392 V512 H0 Z"
          fill="#2a6aa6"/>
    <!-- seagull -->
    <path d="M78 150 q 14 -14 28 0 q 14 -14 28 0" fill="none" stroke="#1b2a3a" stroke-width="5" stroke-linecap="round"/>

    <!-- cap ribbons, fluttering behind the head -->
    <path d="M330 134 C 372 150 400 196 420 250 L 402 244 L 400 268 C 384 214 360 176 318 152 Z"
          fill="#1d3557" stroke="#1b2a3a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M326 146 C 360 172 378 220 386 282 L 370 270 L 362 290 C 356 232 340 190 312 160 Z"
          fill="#24426b" stroke="#1b2a3a" stroke-width="5" stroke-linejoin="round"/>

    <!-- body: white middy blouse -->
    <path d="M70 520 C 84 400 150 336 256 334 C 362 336 428 400 442 520 Z"
          fill="#fbfbf6" stroke="#1b2a3a" stroke-width="6" stroke-linejoin="round"/>
    <!-- sleeve folds -->
    <path d="M118 430 q 10 40 6 90" fill="none" stroke="#1b2a3a" stroke-width="5" stroke-linecap="round"/>
    <path d="M394 430 q -10 40 -6 90" fill="none" stroke="#1b2a3a" stroke-width="5" stroke-linecap="round"/>

    <!-- neck -->
    <path d="M222 286 L 222 344 L 290 344 L 290 286 Z" fill="#f6c9a2" stroke="#1b2a3a" stroke-width="6"/>

    <!-- striped undershirt in the V -->
    <path d="M206 338 L 256 420 L 306 338 Z" fill="#fbfbf6" stroke="#1b2a3a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M214 352 H 298 M 223 367 H 289 M 232 382 H 280 M 241 397 H 271" stroke="#1d3557" stroke-width="7"/>

    <!-- big square sailor collar -->
    <path d="M118 360 C 150 340 178 334 204 334 L 256 428 L 308 334 C 334 334 362 340 394 360 L 420 430 L 256 488 L 92 430 Z"
          fill="#1d3557" stroke="#1b2a3a" stroke-width="6" stroke-linejoin="round"/>
    <!-- white stripes on the collar -->
    <path d="M118 378 L 108 424 L 256 474 L 404 424 L 394 378" fill="none" stroke="#fbfbf6" stroke-width="5" stroke-linejoin="round"/>
    <path d="M206 350 L 256 444 L 306 350" fill="none" stroke="#fbfbf6" stroke-width="5" stroke-linejoin="round"/>

    <!-- red neckerchief bow -->
    <path d="M256 438 L 204 412 L 210 466 Z" fill="#d62f3a" stroke="#1b2a3a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M256 438 L 308 412 L 302 466 Z" fill="#d62f3a" stroke="#1b2a3a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M246 446 L 226 512 L 248 500 L 256 516 L 262 450 Z" fill="#c22430" stroke="#1b2a3a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M266 446 L 290 510 L 270 500 L 262 514 L 252 450 Z" fill="#d62f3a" stroke="#1b2a3a" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="256" cy="440" r="15" fill="#e8434d" stroke="#1b2a3a" stroke-width="5"/>

  </g>

  <!-- ears -->
  <circle cx="160" cy="214" r="22" fill="#f6c9a2" stroke="#1b2a3a" stroke-width="6"/>
  <circle cx="352" cy="214" r="22" fill="#f6c9a2" stroke="#1b2a3a" stroke-width="6"/>
  <path d="M154 206 q 10 8 2 18" fill="none" stroke="#1b2a3a" stroke-width="4" stroke-linecap="round"/>
  <path d="M358 206 q -10 8 -2 18" fill="none" stroke="#1b2a3a" stroke-width="4" stroke-linecap="round"/>

  <!-- head -->
  <ellipse cx="256" cy="212" rx="96" ry="98" fill="#f9d2ad" stroke="#1b2a3a" stroke-width="6"/>

  <!-- hair tufts under the cap -->
  <path d="M176 150 q 8 34 30 30 q -2 -18 14 -24 q 4 24 30 20 q -4 -16 10 -24 q 10 22 34 16 q -6 -14 6 -22 q 14 16 32 12 L 330 140 Z"
        fill="#a0522d" stroke="#1b2a3a" stroke-width="5" stroke-linejoin="round"/>

  <!-- eyebrows -->
  <path d="M196 182 q 20 -16 40 -4" fill="none" stroke="#5a2e14" stroke-width="7" stroke-linecap="round"/>
  <path d="M276 178 q 20 -12 40 4" fill="none" stroke="#5a2e14" stroke-width="7" stroke-linecap="round"/>

  <!-- eyes (one winking: Jack's the lad) -->
  <ellipse cx="218" cy="212" rx="18" ry="22" fill="#ffffff" stroke="#1b2a3a" stroke-width="5"/>
  <circle cx="222" cy="216" r="10" fill="#1b2a3a"/>
  <circle cx="226" cy="211" r="4" fill="#ffffff"/>
  <path d="M278 214 q 18 -14 36 0" fill="none" stroke="#1b2a3a" stroke-width="6" stroke-linecap="round"/>
  <path d="M310 206 l 8 -6" fill="none" stroke="#1b2a3a" stroke-width="4" stroke-linecap="round"/>

  <!-- cheeks and freckles -->
  <ellipse cx="196" cy="252" rx="18" ry="11" fill="#f08a8a" opacity="0.55"/>
  <ellipse cx="318" cy="252" rx="18" ry="11" fill="#f08a8a" opacity="0.55"/>
  <g fill="#b5673a">
    <circle cx="190" cy="244" r="2.6"/><circle cx="200" cy="240" r="2.6"/><circle cx="204" cy="250" r="2.6"/>
    <circle cx="312" cy="244" r="2.6"/><circle cx="322" cy="240" r="2.6"/><circle cx="326" cy="250" r="2.6"/>
  </g>

  <!-- nose -->
  <path d="M256 222 q 14 18 -4 26" fill="none" stroke="#1b2a3a" stroke-width="5" stroke-linecap="round"/>

  <!-- big grin -->
  <path d="M212 266 q 44 52 92 -2 q -46 14 -92 2 Z" fill="#7a1e24" stroke="#1b2a3a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M220 270 q 40 10 76 -2 l -4 8 q -34 8 -68 0 Z" fill="#ffffff"/>
  <path d="M244 296 q 14 -12 28 0 q -14 8 -28 0 Z" fill="#e8636b"/>

  <!-- old-fashioned flat sailor cap, tilted -->
  <g transform="rotate(-9 256 130)">
    <!-- crown -->
    <path d="M154 128 C 150 84 362 84 358 128 L 350 150 L 162 150 Z" fill="#1d3557" stroke="#1b2a3a" stroke-width="6" stroke-linejoin="round"/>
    <ellipse cx="256" cy="98" rx="112" ry="24" fill="#24426b" stroke="#1b2a3a" stroke-width="6"/>
    <!-- band with the ship's name -->
    <path d="M160 136 H 352 L 348 166 H 164 Z" fill="#142640" stroke="#1b2a3a" stroke-width="5" stroke-linejoin="round"/>
    <text x="256" y="160" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold"
          font-size="22" letter-spacing="3" fill="#f2c94c">JACK</text>
    <!-- button on top -->
    <circle cx="256" cy="94" r="7" fill="#d62f3a" stroke="#1b2a3a" stroke-width="4"/>
  </g>

  <!-- badge rim -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="#1b2a3a" stroke-width="12"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#f2c94c" stroke-width="5"/>
</svg>
